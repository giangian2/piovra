spring:
  application:
    name: piovra-connector-woocommerce
  threads:
    # Decisive here: the connector spends 95% of its time waiting on marketplace APIs.
    # The concurrency limit is NOT the pool, it is the rate limiter.
    virtual:
      enabled: true
  datasource:
    url: ${PIOVRA_DB_URL:jdbc:postgresql://localhost:5432/piovra}
    username: ${PIOVRA_DB_USER:piovra_connector_woocommerce}
    password: ${PIOVRA_DB_PASSWORD:piovra_connector_woocommerce}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: connector_woocommerce
    locations:
      - classpath:db/migration/connector_woocommerce
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        compression.type: zstd
        linger.ms: 20
        batch.size: 131072
    consumer:
      group-id: piovra-connector-woocommerce
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 50
        # Deliberately high: a marketplace call can be slow and we do not want the broker
        # to consider dead a consumer that is merely waiting.
        max.poll.interval.ms: 600000
    listener:
      ack-mode: manual

piovra:
  connector:
    channel-type: WOOCOMMERCE
    # Who holds a poll lease. Two replicas of the same image must not claim to be each other.
    instance-id: ${HOSTNAME:local}
    # In process for now, one bucket per account. A cluster-wide bucket in Redis only starts to
    # matter once the outbound write path competes for the same quota.
    rate-limit:
      requests-per-second: 8
      burst: 20
    polling:
      orders: PT2M
      # Sliding window with overlap: absorbs the marketplace's visibility lag. The duplicates it
      # produces die on the order service's UNIQUE (channel_id, channel_order_id).
      overlap: PT5M
      # How long one replica may hold a channel. Well above a full multi-page scan, and renewed on
      # every committed page; if the process dies it expires on its own.
      lease: PT5M
      page-size: 100
      # Stops one very stale channel from starving the others inside a tick.
      max-pages-per-tick: 20
      reconcile: PT6H
    storage:
      # The raw marketplace payload contains personal data: it is archived here and only its URI
      # travels on Kafka (docs/07-order-flow.md).
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      bucket: ${S3_BUCKET:piovra-raw-payloads}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:piovra}
      secret-key: ${S3_SECRET_KEY:piovra123}
    # Stand-in for Vault, which ChannelDefinition.credentialsRef already points at and which is not
    # in the stack yet (docs/08-marketplace-drivers.md section 3.3). One entry per channelId:
    # credentials:
    #   woo-local:
    #     consumer-key: ck_...
    #     consumer-secret: cs_...
    credentials: {}

resilience4j:
  circuitbreaker:
    instances:
      woocommerce:
        failure-rate-threshold: 50
        sliding-window-size: 20
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3

server:
  port: 8082
  shutdown: graceful

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true

logging:
  level:
    dev.piovra: INFO
  structured:
    format:
      console: ecs
